name: Daily Auto Football

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build today's site
        run: python build.py
        
      - name: Push to GitHub Pages
        run: |
          git config user.name "FootPulse Bot"
          git config user.email "bot@footpulse.com"
          git add index.html
          git commit -m "Auto update for today" || echo "No changes"
          git push
